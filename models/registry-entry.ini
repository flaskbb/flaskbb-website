[model]
name = Registry Entry
label = {{ this.title }}

[fields.title]
label = Title
type = string

[fields.kind]
label = Kind
type = select
choices = plugin, theme
choice_labels = Plugin, Theme
default = plugin
width = 1/4

[fields.official]
label = Official
checkbox_label = Maintained by the FlaskBB team
type = boolean
width = 1/4

[fields.bundled]
label = Bundled
checkbox_label = Ships with FlaskBB, nothing to install
type = boolean
width = 1/4

[fields.summary]
label = Summary
type = string

[fields.author]
label = Author
type = string
width = 1/2

[fields.license]
label = License
type = string
description = Only used when PyPI has no license expression for the package
width = 1/2

[fields.version]
label = Latest Version
type = string
description = Only for entries without a PyPI package, otherwise read from PyPI
width = 1/2

[fields.requires]
label = Requires
type = string
description = e.g. FlaskBB >= 3.0.0. Only used when the package on PyPI does not depend on FlaskBB
width = 1/2

[fields.package]
label = PyPI Package
type = string
width = 1/2

[fields.repository]
label = Repository
type = url
width = 1/2

[fields.icon]
label = Icon
type = string
description = Font Awesome solid icon name without the fa- prefix, shown when there is no preview
width = 1/2

[fields.preview]
label = Preview Image
type = string
description = Filename of an attached image
width = 1/2

[fields.tags]
label = Tags
type = strings

[fields.body]
label = Description
type = markdown
